# Configuración para Railway con Nixpacks
[phases.setup]
nixPkgs = ["python311", "gcc", "pkg-config"]
aptPkgs = ["libmariadb-dev"]

[phases.install]
cmds = ["python3.11 -m pip install --upgrade pip", "python3.11 -m pip install -r requirements.txt"]

[start]
cmd = "python3.11 manage.py collectstatic --noinput && python3.11 manage.py migrate && gunicorn backend_tesis.wsgi --bind 0.0.0.0:$PORT"

[variables]
NIXPACKS_PYTHON_VERSION = "3.11"
