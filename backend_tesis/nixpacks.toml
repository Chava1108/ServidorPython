# Configuración para Railway con Nixpacks
[phases.setup]
nixPkgs = ["python311", "gcc", "pkg-config"]
aptPkgs = ["libmariadb-dev"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn backend_tesis.wsgi --bind 0.0.0.0:$PORT"
